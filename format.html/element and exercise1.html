<!-- quick quize -->
<!-- without using br tag, write a vertically aligned form asking for user name, city and pincode -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>

<body>
    <form action="POST">
        <div>
            <label for="username">Enter your username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username">
        </div>
        <div>
            <label for="" city">Enter your city</label>
            <input type="text" id="city" name="city" placeholder="Enter your city">
        </div>
        <label for="PinCode">Enter your PinCode</label>
        <input type="" text" id="PinCode" name="PinCode" placeholder="Enter your PinCode">
        </div>
    </form>
</body>

</html>
