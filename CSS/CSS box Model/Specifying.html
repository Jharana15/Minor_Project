<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Inline style> Id selector> Class or Attributes selectors> Element Selector */
        /* The specificity of this selector is 1 */

        h1{
            color: aqua;;
        }
        /* The specificity of this selector is 10 */
        .cpurple{
            color: purple;

        }
        /* The specificity of this selector is (h1=1 and .class=10 specificity) 1+10 */
        h1.yellow{ 
            color: yellow;
        }
        /* The specificity of this selector is  10 */
        .cred{
            color:red;
        }

         /* This is an example os Attribute selector,The specificity of this selector is  10 */  
         /* [data-x=a]{
            color: maroon;
        }  */
          /* The specificity of this selector is 1(a specificity) + (class)10 + (jharana) 10 + 10 + 10*/
          /* href is the attribute selector */
        a.harryclass.jharana-class[href]:hover{
            color: burlywood;
        }
    </style>
</head>
<body>
    <div>
        <h1 class="yellow cred cpurple" data-x="a">CSS Specificity</h1>
    </div>
    
</body>
</html>
